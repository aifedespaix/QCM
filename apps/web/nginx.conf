# Schéma vu par le visiteur : l'en-tête du proxy HTTPS (Dokploy/Traefik), sinon celui de la connexion.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Derrière un proxy HTTPS : les redirections (ajout du « / » final) restent relatives, jamais en http://.
  absolute_redirect off;

  gzip on;
  gzip_types text/xml application/xml application/manifest+json text/css application/javascript application/json image/svg+xml;

  # PocketBase (service « qcm-pocketbase » du compose) sous le même domaine : /api (API, fichiers, temps réel)
  # et /_/ (interface d'administration). Le nom est résolu à chaque requête (DNS interne de Docker) :
  # nginx démarre même si PocketBase n'est pas encore prêt, et suit ses redémarrages.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $pocketbase http://qcm-pocketbase:8090;
    proxy_pass $pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Temps réel (SSE) et envois de fichiers : pas de tampon, délais longs.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    client_max_body_size 50m;
  }

  location /_/ {
    set $pocketbase http://qcm-pocketbase:8090;
    proxy_pass $pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Le service worker et le manifeste doivent toujours être revalidés : mises à jour de l'app immédiates.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }
}
