# Schéma vu par le visiteur : l'en-tête du proxy HTTPS (Dokploy/Traefik), sinon celui de la connexion.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Journal des échanges avec PocketBase : le temps de connexion et de réponse du serveur amont, et son adresse.
# Une connexion qui traîne (ou une adresse qui change d'une requête à l'autre) se voit ici : `docker logs`.
log_format qcm_upstream '$remote_addr "$request" $status rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time ua=$upstream_addr';

# Micro-cache des pages rendues par le serveur (bibliothèque, fiches, plan du site). Les pages ne
# dépendent pas du compte (il n'est connu que du navigateur) : une même copie sert tout le monde.
# Surtout, si le rendu ou PocketBase flanche, nginx sert la dernière copie valide au lieu d'une erreur.
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr:10m max_size=200m inactive=24h use_temp_path=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Derrière un proxy HTTPS : les redirections (ajout du « / » final) restent relatives, jamais en http://.
  absolute_redirect off;

  gzip on;
  gzip_types text/xml application/xml application/manifest+json text/css application/javascript application/json image/svg+xml;

  # PocketBase (service « qcm-pocketbase » du compose) sous le même domaine : /api (API, fichiers, temps réel)
  # et /_/ (interface d'administration). Le nom est résolu à chaque requête (DNS interne de Docker) :
  # nginx démarre même si PocketBase n'est pas encore prêt, et suit ses redémarrages.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  # Un serveur amont qui ne répond pas doit échouer vite, pas faire attendre le navigateur : sans
  # délai de connexion court, nginx patiente 60 s sur une adresse morte (conteneur redémarré, réseau
  # partagé de Dokploy) et la bibliothèque reste vide jusqu'au rechargement de la page.
  # Les lectures (GET) sont rejouées sur une autre adresse ; les écritures ne le sont jamais.
  location /api/ {
    set $pocketbase http://qcm-pocketbase:8090;
    proxy_pass $pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 20s;
    proxy_read_timeout 30s;
    proxy_send_timeout 120s;
    # Envois de fichiers.
    client_max_body_size 50m;
    access_log /dev/stdout qcm_upstream;
  }

  # Temps réel (SSE) : connexion longue, pas de tampon.
  location /api/realtime {
    set $pocketbase http://qcm-pocketbase:8090;
    proxy_pass $pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_buffering off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  location /_/ {
    set $pocketbase http://qcm-pocketbase:8090;
    proxy_pass $pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Le service worker et le manifeste doivent toujours être revalidés : mises à jour de l'app immédiates.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Fichiers générés au build (accueil, éditeur, suivi…) ; sinon, rendu par le serveur Node.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html @ssr;
  }

  # Serveur de rendu Astro (Node), dans le même conteneur.
  location @ssr {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    proxy_cache ssr;
    proxy_cache_key $scheme$host$request_uri;
    # Le navigateur revalide toujours (Cache-Control: no-cache envoyé par Astro) ; nginx, lui, garde
    # une copie quelques secondes : les pics de visites ne sollicitent pas PocketBase à chaque fois.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_cache_valid 200 301 20s;
    proxy_cache_valid 404 10s;
    # Rendu en échec (503 : PocketBase injoignable) ou serveur Node arrêté : dernière copie valide.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
    # Serveur Node injoignable et aucune copie en cache : page « hors connexion » plutôt qu'une erreur brute.
    error_page 502 504 /offline.html;
  }
}
