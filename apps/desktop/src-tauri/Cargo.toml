[package]
name = "qcm-desktop"
version = "0.1.0"
description = "QCM - lecteur hors-ligne de fichiers .qcm"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "qcm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
# Mêmes réglages TLS que tauri-plugin-updater (rustls + ring) : aucune dépendance compilée en plus.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
