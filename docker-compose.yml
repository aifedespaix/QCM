# Déploiement Dokploy (type « Compose »). Les domaines et le HTTPS se règlent dans
# Dokploy > Compose > Domains : `qcm-pocketbase` sur le port 8090, `qcm-web` sur le port 80.
# Les services portent un préfixe : Dokploy met tous les projets sur un réseau partagé, où un nom
# générique (`pocketbase`, `web`) peut être celui d'un autre projet et recevoir une partie du trafic.
services:
  qcm-pocketbase:
    build:
      context: ./backend
      args:
        PB_VERSION: "0.40.6"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      PB_ALLOWED_ORIGINS: ${PB_ALLOWED_ORIGINS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - pb_data:/pb/pb_data
    expose:
      - "8090"

  qcm-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_PB_URL: ${PUBLIC_PB_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        PUBLIC_RELEASES_URL: ${PUBLIC_RELEASES_URL}
    restart: unless-stopped
    environment:
      # Rendu des pages (bibliothèque, fiches) : PocketBase est lu par le réseau interne, sans détour par Internet.
      PB_INTERNAL_URL: ${PB_INTERNAL_URL:-http://qcm-pocketbase:8090}
    depends_on:
      - qcm-pocketbase
    # Vérifie le trajet complet site -> nginx -> PocketBase (celui qui a lâché : connexion impossible
    # alors que PocketBase tourne), et le serveur de rendu des pages. Le test interne de PocketBase,
    # lui, ne voit pas ce genre de panne.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 4 http://127.0.0.1/api/health && wget -q --spider -T 4 http://127.0.0.1:4321/healthz || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    expose:
      - "80"

volumes:
  pb_data:
