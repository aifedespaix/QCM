# Déploiement Dokploy (type « Compose »). Les domaines et le HTTPS se règlent dans
# Dokploy > Compose > Domains : `qcm-pocketbase` sur le port 8090, `qcm-web` sur le port 80.
# Les services portent un préfixe : Dokploy met tous les projets sur un réseau partagé, où un nom
# générique (`pocketbase`, `web`) peut être celui d'un autre projet et recevoir une partie du trafic.
services:
  qcm-pocketbase:
    build:
      context: ./backend
      args:
        PB_VERSION: "0.40.6"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      PB_ALLOWED_ORIGINS: ${PB_ALLOWED_ORIGINS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - pb_data:/pb/pb_data
    expose:
      - "8090"

  qcm-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_PB_URL: ${PUBLIC_PB_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        PUBLIC_RELEASES_URL: ${PUBLIC_RELEASES_URL}
    restart: unless-stopped
    depends_on:
      - qcm-pocketbase
    expose:
      - "80"

volumes:
  pb_data:
