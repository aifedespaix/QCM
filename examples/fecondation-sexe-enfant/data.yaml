version: 1
meta:
  title: "Fécondation et sexe de l'enfant"
  subject: svt
  level: 3e
  chapter: "Hérédité : gamètes, fécondation et sexe de l'enfant"
  language: fr
  author: "Équipe QCM"
  description: "Huit questions sur les gamètes, la fécondation, la cellule-œuf et le sexe de l'enfant."
questions:
  - id: q1
    prompt: "Comment s'appelle la rencontre d'un spermatozoïde et d'un ovule ?"
    choices:
      - text: "La mutation"
      - text: "La fécondation"
        correct: true
      - text: "La puberté"
      - text: "La division"
    hint: "Elle forme la première cellule d'un nouvel être humain."
    explanation: "La fécondation est l'union d'un spermatozoïde et d'un ovule. Elle forme la cellule-œuf."
  - id: q2
    prompt: "Combien de chromosomes contient un gamète, ovule ou spermatozoïde ?"
    choices:
      - text: "46"
      - text: "92"
      - text: "22"
      - text: "23"
        correct: true
    hint: "Un gamète contient la moitié des chromosomes d'une cellule du corps."
    explanation: "Un gamète contient 23 chromosomes, soit la moitié de 46. L'enfant reçoit donc 23 chromosomes de chaque parent."
  - id: q3
    prompt: "Combien de chromosomes contient la cellule-œuf formée à la fécondation ?"
    choices:
      - text: "23"
      - text: "92"
      - text: "46"
        correct: true
      - text: "69"
    hint: "Elle reçoit 23 chromosomes de la mère et 23 chromosomes du père."
    explanation: "23 chromosomes de l'ovule et 23 chromosomes du spermatozoïde donnent 46 chromosomes, soit 23 paires."
  - id: q4
    prompt: "Quel chromosome sexuel contient chaque ovule ?"
    choices:
      - text: "Un chromosome Y"
      - text: "Deux chromosomes X"
      - text: "Un chromosome X ou un chromosome Y"
      - text: "Un chromosome X"
        correct: true
    hint: "Une femme a seulement des chromosomes X."
    explanation: "Une femme a les chromosomes XX. Chaque ovule reçoit un seul chromosome sexuel, et c'est toujours un X."
  - id: q5
    prompt: "Quel chromosome sexuel contient un spermatozoïde ?"
    choices:
      - text: "Un chromosome X ou un chromosome Y"
        correct: true
      - text: "Un chromosome X"
      - text: "Deux chromosomes X et Y"
      - text: "Un chromosome Y"
    hint: "Un homme a un chromosome X et un chromosome Y. Chaque spermatozoïde reçoit un seul des deux."
    explanation: "Un homme a les chromosomes XY. Un spermatozoïde reçoit soit le X, soit le Y."
  - id: q6
    prompt: "Un spermatozoïde qui porte un chromosome X féconde un ovule. Quel est le sexe de l'enfant ?"
    choices:
      - text: "Un garçon"
      - text: "Une fille"
        correct: true
    hint: "L'ovule apporte toujours un chromosome X."
    explanation: "L'ovule apporte un X et le spermatozoïde apporte un X. La cellule-œuf est XX, donc l'enfant est une fille."
  - id: q7
    prompt: "Un spermatozoïde qui porte un chromosome Y féconde un ovule. Quel est le sexe de l'enfant ?"
    choices:
      - text: "Un garçon"
        correct: true
      - text: "Une fille"
    hint: "L'ovule apporte toujours un chromosome X."
    explanation: "L'ovule apporte un X et le spermatozoïde apporte un Y. La cellule-œuf est XY, donc l'enfant est un garçon."
  - id: q8
    prompt: "Quelle cellule reproductrice décide du sexe de l'enfant ?"
    choices:
      - text: "L'ovule"
      - text: "Le spermatozoïde"
        correct: true
      - text: "Les deux de la même façon"
    hint: "Une seule des deux cellules peut porter un chromosome Y."
    explanation: "Tous les ovules portent un X. Le spermatozoïde porte un X ou un Y : c'est lui qui décide du sexe."
